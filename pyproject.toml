[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tmux-injector"
version = "0.1.0"
description = "MCP server for injecting commands into tmux sessions (Python REPL, TCL/OpenROAD, Shell)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "tmux", "claude", "automation", "eda", "openroad"]
authors = [
    { name = "Kiyoshi" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
mcp-tmux-injector = "mcp_tmux_injector:main"


[tool.hatch.build.targets.wheel]
include = ["mcp_tmux_injector.py"]

[tool.hatch.build.targets.sdist]
include = [
    "mcp_tmux_injector.py",
    "instructions.txt",
    "README.md",
    "LICENSE",
]
